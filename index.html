 đó Bộ Giáo dục và Đào tạo giữ vai trò chủ đạo.", "Của Mặt trận Tổ quốc Việt Nam và các tổ chức thành viên, trong đó Mặt trận giữ vai trò chủ đạo.", "Của hệ thống chính trị và toàn dân, trong đó Nhà nước giữ vai trò chủ đạo."], "answer": 3, "source": "Luật Giáo dục quốc phòng và an ninh số 30/2013/QH13 (Văn bản hợp nhất số 48/VBHN-VPQH ngày 17/3/2026 của Văn phòng Quốc hội), Điều 5, khoản 2.", "explanation": ""}, {"id": 4, "set": 1, "number": 4, "text": "Theo Điều 7 Luật Giáo dục quốc phòng và an ninh, công dân có quyền và trách nhiệm gì về giáo dục quốc phòng và an ninh?", "level": "Nhận biết", "options": ["Học tập, nghiên cứu để nắm vững kiến thức quốc phòng và an ninh.", "Chỉ được tham gia khi tự nguyện đăng ký với cơ quan có thẩm quyền.", "Chỉ có trách nhiệm học tập khi thuộc diện được triệu tập bồi dưỡng.", "Chỉ có trách nhiệm học tập khi được gọi nhập ngũ."], "answer": 0, "source": "Luật Giáo dục quốc phòng và an ninh số 30/2013/QH13 (Văn bản hợp nhất số 48/VBHN-VPQH ngày 17/3/2026 của Văn phòng Quốc hội), Điều 7.", "explanation": ""}, {"id": 5, "set": 1, "number": 5, "text": "Theo Điều 8 khoản 4 Luật Giáo dục quốc phòng và an ninh, ai phê duyệt quy hoạch hệ thống và quy định điều kiện thành lập trung tâm giáo dục quốc phòng và an ninh?", "level": "Nhận biết", "options": ["Bộ trưởng Bộ Quốc phòng.", "Bộ trưởng Bộ Giáo dục và Đào tạo.", "Thủ tướng Chính phủ.", "Chủ tịch Ủy ban nhân dân cấp tỉnh."], "answer": 2, "source": "Luật Giáo dục quốc phòng và an ninh số 30/2013/QH13 (Văn bản hợp nhất số 48/VBHN-VPQH ngày 17/3/2026 của Văn phòng Quốc hội), Điều 8, khoản 4.", "explanation": ""}, {"id": 6, "set": 1, "number": 6, "text": "Theo Điều 11 Luật Giáo dục quốc phòng và an ninh, giáo dục quốc phòng và an ninh trong trường trung học phổ thông là gì?", "level": "Nhận biết", "options": ["Hoạt động ngoại khóa tự nguyện của học sinh.", "Nội dung lồng ghép trong các môn học khác.", "Chuyên đề tự chọn theo nhu cầu của nhà trường.", "Môn học chính khóa."], "answer": 3, "source": "Luật Giáo dục quốc phòng và an ninh số 30/2013/QH13 (Văn bản hợp nhất số 48/VBHN-VPQH ngày 17/3/2026 của Văn phòng Quốc hội), Điều 11, khoản 1.", "explanation": ""}, {"id": 7, "set": 1, "number": 7, "text": "Theo Điều 23 khoản 2 Luật Giáo dục quốc phòng và an ninh, giáo viên, giảng viên giáo dục quốc phòng và an ninh phải có bằng nào sau đây?", "level": "Nhận biết", "options": ["Bằng tốt nghiệp trung cấp sư phạm trở lên.", "Bằng cử nhân giáo dục quốc phòng và an ninh trở lên.", "Bằng tốt nghiệp đại học chuyên ngành quân sự trở lên.", "Bằng thạc sĩ chuyên ngành quản lý giáo dục trở lên."], "answer": 1, "source": "Luật Giáo dục quốc phòng và an ninh số 30/2013/QH13 (Văn bản hợp nhất số 48/VBHN-VPQH ngày 17/3/2026 của Văn phòng Quốc hội), Điều 23, khoản 2.", "explanation": ""}, {"id": 8, "set": 1, "number": 8, "text": "Theo Điều 24 khoản 1 Luật Giáo dục quốc phòng và an ninh, đào tạo chính quy chuyên ngành giáo dục quốc phòng và an ninh với đối tượng tuyển sinh có bằng tốt nghiệp trung học phổ thông được tập trung trong bao lâu?", "level": "Nhận biết", "options": ["03 năm.", "05 năm.", "04 năm.", "02 năm."], "answer": 2, "source": "Luật Giáo dục quốc phòng và an ninh số 30/2013/QH13 (Văn bản hợp nhất số 48/VBHN-VPQH ngày 17/3/2026 của Văn phòng Quốc hội), Điều 24, khoản 1, điểm a.", "explanation": ""}, {"id": 9, "set": 1, "number": 9, "text": "Theo Điều 33 khoản 2 Luật Giáo dục quốc phòng và an ninh, cơ quan nào chủ trì, phối hợp với Bộ Công an, Bộ Giáo dục và Đào tạo giúp Chính phủ thực hiện quản lý nhà nước về giáo dục quốc phòng và an ninh?", "level": "Nhận biết", "options": ["Bộ Công an.", "Bộ Giáo dục và Đào tạo.", "Bộ Nội vụ.", "Bộ Quốc phòng."], "answer": 3, "source": "Luật Giáo dục quốc phòng và an ninh số 30/2013/QH13 (Văn bản hợp nhất số 48/VBHN-VPQH ngày 17/3/2026 của Văn phòng Quốc hội), Điều 33, khoản 2.", "explanation": ""}, {"id": 10, "set": 1, "number": 10, "text": "Luật số 98/2025/QH15 sửa đổi, bổ sung một số điều của Luật Giáo dục quốc phòng và an ninh có hiệu lực thi hành từ ngày nào?", "level": "Nhận biết", "options": ["Ngày 01 tháng 01 năm 2025.", "Ngày 27 tháng 06 năm 2025.", "Ngày 01 tháng 7 năm 2025.", "Ngày 01 tháng 01 năm 2026."], "answer": 2, "source": "Luật số 98/2025/QH15; Văn bản hợp nhất số 48/VBHN-VPQH (Điều khoản thi hành).", "explanation": ""}, {"id": 11, "set": 1, "number": 11, "text": "Văn bản hợp nhất Luật Giáo dục quốc phòng và an ninh mới nhất do Văn phòng Quốc hội ban hành ngày 17/03/2026 có số hiệu nào?", "level": "Nhận biết", "options": ["Số 30/2013/QH13.", "Số 48/VBHN-VPQH.", "Số 98/2025/QH15.", "Số 72/VBHN-VPQH."], "answer": 1, "source": "Văn bản hợp nhất số 48/VBHN-VPQH ngày 17/03/2026 của Văn phòng Quốc hội.", "explanation": ""}, {"id": 12, "set": 1, "number": 12, "text": "Theo quy định hiện hành tại Điều 44 Luật GDQP&AN (sửa đổi năm 2025), Hội đồng giáo dục quốc phòng và an ninh được thành lập ở những cấp nào?", "level": "Nhận biết", "options": ["Trung ương, cấp tỉnh và cấp huyện.", "Trung ương, quân khu, cấp tỉnh và cấp xã.", "Chỉ thành lập ở cấp Trung ương và cấp tỉnh.", "Cấp tỉnh, cấp huyện và cấp xã."], "answer": 1, "source": "Luật GDQP&AN, Điều 44, khoản 1 (sửa đổi, bổ sung bởi Luật số 98/2025/QH15); Văn bản hợp nhất số 48/VBHN-VPQH.", "explanation": ""}, {"id": 13, "set": 1, "number": 13, "text": "Theo Điều 10 Luật Giáo dục quốc phòng và an ninh, giáo dục quốc phòng và an ninh trong trường tiểu học, trung học cơ sở được thực hiện theo hình thức nào?", "level": "Thông hiểu", "options": ["Học tập trung tại trung tâm giáo dục quốc phòng và an ninh theo từng khóa.", "Môn học chính khóa độc lập có phân phối chương trình riêng.", "Chỉ thực hiện thông qua hoạt động ngoại khóa tự nguyện.", "Lồng ghép qua nội dung các môn học, kết hợp hoạt động ngoại khóa phù hợp với lứa tuổi."], "answer": 3, "source": "Luật Giáo dục quốc phòng và an ninh số 30/2013/QH13 (Văn bản hợp nhất số 48/VBHN-VPQH ngày 17/3/2026 của Văn phòng Quốc hội), Điều 10, khoản 1.", "explanation": ""}, {"id": 14, "set": 1, "number": 14, "text": "Theo Điều 12 khoản 3 Luật Giáo dục quốc phòng và an ninh, việc dạy và học môn giáo dục quốc phòng và an ninh trong trường cao đẳng nghề, cơ sở giáo dục đại học được tổ chức như thế nào?", "level": "Thông hiểu", "options": ["Tổ chức dạy và học tập trung tại trung tâm giáo dục quốc phòng và an ninh hoặc tại trường, cơ sở giáo dục.", "Tổ chức học trực tuyến hoàn toàn, người học tự học tại nhà.", "Tổ chức học phân tán theo từng học kỳ tại đơn vị cơ sở của người học.", "Tổ chức học tại trường trung học phổ thông nơi người học đã tốt nghiệp."], "answer": 0, "source": "Luật Giáo dục quốc phòng và an ninh số 30/2013/QH13 (Văn bản hợp nhất số 48/VBHN-VPQH ngày 17/3/2026 của Văn phòng Quốc hội), Điều 12, khoản 3.", "explanation": ""}, {"id": 15, "set": 1, "number": 15, "text": "Quy định tại Điều 15 Luật Giáo dục quốc phòng và an ninh (bồi dưỡng cho người quản lý doanh nghiệp ngoài khu vực nhà nước, đơn vị sự nghiệp ngoài công lập) không áp dụng đối với đối tượng nào?", "level": "Thông hiểu", "options": ["Người quản lý doanh nghiệp có quy mô vừa trở lên.", "Người quản lý doanh nghiệp hoạt động ở khu vực biên giới, hải đảo.", "Người quản lý đơn vị sự nghiệp ngoài công lập.", "Người nước ngoài."], "answer": 3, "source": "Luật Giáo dục quốc phòng và an ninh số 30/2013/QH13 (Văn bản hợp nhất số 48/VBHN-VPQH ngày 17/3/2026 của Văn phòng Quốc hội), Điều 15, khoản 4.", "explanation": ""}, {"id": 16, "set": 1, "number": 16, "text": "Theo Điều 24 khoản 3 Luật Giáo dục quốc phòng và an ninh, ai quyết định cơ sở giáo dục đại học, trường của lực lượng vũ trang nhân dân có đủ điều kiện được đào tạo giáo viên, giảng viên giáo dục quốc phòng và an ninh?", "level": "Thông hiểu", "options": ["Bộ Giáo dục và Đào tạo.", "Bộ Quốc phòng.", "Chính phủ.", "Ủy ban nhân dân cấp tỉnh."], "answer": 0, "source": "Luật Giáo dục quốc phòng và an ninh số 30/2013/QH13 (Văn bản hợp nhất số 48/VBHN-VPQH ngày 17/3/2026 của Văn phòng Quốc hội), Điều 24, khoản 3.", "explanation": ""}, {"id": 17, "set": 1, "number": 17, "text": "Theo Điều 25 khoản 2 Luật Giáo dục quốc phòng và an ninh, giáo viên, giảng viên giáo dục quốc phòng và an ninh được bảo đảm chế độ trang phục, trừ đối tượng nào?", "level": "Thông hiểu", "options": ["Giáo viên, giảng viên thỉnh giảng.", "Giáo viên, giảng viên chuyên trách.", "Cán bộ quân đội, công an biệt phái.", "Giảng viên tại trường cao đẳng nghề."], "answer": 2, "source": "Luật Giáo dục quốc phòng và an ninh số 30/2013/QH13 (Văn bản hợp nhất số 48/VBHN-VPQH ngày 17/3/2026 của Văn phòng Quốc hội), Điều 25, khoản 2.", "explanation": ""}, {"id": 18, "set": 1, "number": 18, "text": "Luật số 123/2025/QH15 sửa đổi, bổ sung một số điều của Luật Giáo dục được Quốc hội thông qua ngày 10/12/2025. Phần lớn quy định của Luật này có hiệu lực thi hành từ ngày nào?", "level": "Nhận biết", "options": ["Ngày 10 tháng 12 năm 2025.", "Ngày 01 tháng 7 năm 2026.", "Ngày 01 tháng 01 năm 2026.", "Ngày 01 tháng 7 năm 2020."], "answer": 2, "source": "Luật số 123/2025/QH15, Điều 2, khoản 1; Văn bản hợp nhất số 72/VBHN-VPQH; trang 1 và trang 48 (chú thích 101).", "explanation": ""}, {"id": 19, "set": 1, "number": 19, "text": "Theo Luật Giáo dục (được sửa đổi, bổ sung năm 2025), giáo dục nghề nghiệp gồm những trình độ nào?", "level": "Nhận biết", "options": ["Sơ cấp, trung học nghề, trung cấp, cao đẳng và các chương trình đào tạo nghề khác.", "Sơ cấp, trung cấp, cao đẳng và đại học.", "Trung học nghề, trung cấp, cao đẳng và đại học.", "Sơ cấp, trung cấp và cao đẳng."], "answer": 0, "source": "Luật Giáo dục số 43/2019/QH14, Điều 6, khoản 2, điểm c (sửa đổi bởi khoản 1 Điều 1 Luật số 123/2025/QH15); Văn bản hợp nhất số 72/VBHN-VPQH; trang 3.", "explanation": ""}, {"id": 20, "set": 1, "number": 20, "text": "Theo Điều 14 Luật Giáo dục (sửa đổi, bổ sung năm 2025), những cấp học nào là giáo dục bắt buộc?", "level": "Nhận biết", "options": ["Giáo dục mầm non và giáo dục tiểu học.", "Giáo dục tiểu học và giáo dục trung học cơ sở.", "Giáo dục tiểu học,  hoàn thành chương trình giáo dục phổ thông.", "Bằng tốt nghiệp trung học phổ thông loại trung bình.", "Chứng chỉ hoàn thành giáo dục bắt buộc."], "answer": 1, "source": "Luật Giáo dục số 43/2019/QH14, Điều 34, khoản 2 (sửa đổi bởi khoản 9 Điều 1 Luật số 123/2025/QH15); Văn bản hợp nhất số 72/VBHN-VPQH; trang 15 – 16.", "explanation": ""}, {"id": 24, "set": 1, "number": 24, "text": "Theo Điều 99 Luật Giáo dục (sửa đổi, bổ sung năm 2025), học phí là gì?", "level": "Thông hiểu", "options": ["Khoản tiền người học phải nộp để chi trả một phần hoặc toàn bộ chi phí của dịch vụ giáo dục, đào tạo.", "Khoản tiền nhà trường thu để chi cho các hoạt động dịch vụ phục vụ và hỗ trợ giáo dục ngoài chương trình.", "Khoản tiền do ngân sách nhà nước cấp cho cơ sở giáo dục theo số lượng người học.", "Khoản tiền người học đóng góp tự nguyện để xây dựng cơ sở vật chất của nhà trường."], "answer": 0, "source": "Luật Giáo dục số 43/2019/QH14, Điều 99, khoản 1 (sửa đổi bởi khoản 24 Điều 1 Luật số 123/2025/QH15); Văn bản hợp nhất số 72/VBHN-VPQH; trang 40 – 41.", "explanation": ""}, {"id": 25, "set": 1, "number": 25, "text": "Theo Điều 19 Luật Giáo dục (sửa đổi, bổ sung năm 2025), Nhà nước có chính sách như thế nào đối với việc ứng dụng trí tuệ nhân tạo trong cơ sở giáo dục?", "level": "Thông hiểu", "options": ["Cấm sử dụng trí tuệ nhân tạo trong mọi hoạt động dạy học và kiểm tra, đánh giá.", "Cho phép sử dụng trí tuệ nhân tạo tự do, không cần có sự kiểm soát.", "Khuyến khích, thúc đẩy ứng dụng công nghệ, trí tuệ nhân tạo có kiểm soát.", "Chỉ cho phép ứng dụng trí tuệ nhân tạo trong cơ sở giáo dục đại học."], "answer": 2, "source": "Luật Giáo dục số 43/2019/QH14, Điều 19, khoản 3 (sửa đổi bởi khoản 5 Điều 1 Luật số 123/2025/QH15); Văn bản hợp nhất số 72/VBHN-VPQH; trang 8 – 9.", "explanation": ""}, {"id": 26, "set": 1, "number": 26, "text": "Hành vi nào sau đây bị nghiêm cấm trong cơ sở giáo dục theo Điều 22 Luật Giáo dục?", "level": "Thông hiểu", "options": ["Công khai các khoản thu theo quy định của pháp luật.", "Ép buộc học sinh học thêm để thu tiền.", "Tổ chức hoạt động trải nghiệm cho học sinh ngoài nhà trường.", "Tiếp nhận tài trợ tự nguyện cho hoạt động giáo dục."], "answer": 1, "source": "Luật Giáo dục số 43/2019/QH14, Điều 22, khoản 5; Văn bản hợp nhất số 72/VBHN-VPQH; trang 9.", "explanation": ""}, {"id": 27, "set": 1, "number": 27, "text": "Theo Điều 44 khoản 1, Luật Giáo dục nghề nghiệp số 124/2025/QH15 có hiệu lực thi hành từ ngày nào?", "level": "Nhận biết", "options": ["Ngày 10 tháng 12 năm 2025.", "Ngày 01 tháng 01 năm 2026.", "Ngày 21 tháng 01 năm 2026.", "Ngày 01 tháng 01 năm 2027."], "answer": 1, "source": "Luật Giáo dục nghề nghiệp số 124/2025/QH15 ngày 10/12/2025 của Quốc hội (Công báo số 36 ngày 21/01/2026), Điều 44, khoản 1.", "explanation": ""}, {"id": 28, "set": 1, "number": 28, "text": "Theo Điều 7 khoản 2 Luật Giáo dục nghề nghiệp, cơ sở giáo dục nghề nghiệp bao gồm những loại nào?", "level": "Nhận biết", "options": ["Trường cao đẳng, trường trung cấp và trung tâm giáo dục nghề nghiệp.", "Trường cao đẳng, trường trung học nghề và doanh nghiệp.", "Trường trung cấp, trường trung học nghề và cơ sở giáo dục đại học.", "Trường cao đẳng, trường trung cấp và trường trung học nghề."], "answer": 3, "source": "Luật Giáo dục nghề nghiệp số 124/2025/QH15 ngày 10/12/2025 của Quốc hội (Công báo số 36 ngày 21/01/2026), Điều 7, khoản 2.", "explanation": ""}, {"id": 29, "set": 1, "number": 29, "text": "Theo Điều 6 khoản 3 điểm c Luật Giáo dục nghề nghiệp, người học hoàn thành chương trình trung học nghề, đủ điều kiện nhưng không dự thi tốt nghiệp hoặc thi không đạt yêu cầu thì được người đứng đầu cơ sở thực hiện hoạt động giáo dục nghề nghiệp cấp loại giấy tờ nào?", "level": "Nhận biết", "options": ["Giấy chứng nhận hoàn thành chương trình trung học nghề.", "Chứng chỉ sơ cấp.", "Bằng tốt nghiệp trung học nghề loại trung bình.", "Giấy xác nhận hoàn thành chương trình trung học cơ sở."], "answer": 0, "source": "Luật Giáo dục nghề nghiệp số 124/2025/QH15 ngày 10/12/2025 của Quốc hội (Công báo số 36 ngày 21/01/2026), Điều 6, khoản 3, điểm c.", "explanation": ""}, {"id": 30, "set": 1, "number": 30, "text": "Theo Điều 11 khoản 1 điểm e Luật Giáo dục nghề nghiệp, trong cơ cấu tổ chức của cơ sở giáo dục nghề nghiệp có thể có tổ chức nào sau đây (nếu có) được thành lập theo quy định?", "level": "Thông hiểu", "options": ["Trung tâm giáo dục thường xuyên cấp tỉnh.", "Trường trung học phổ thông thực hành.", "Trung tâm giáo dục quốc phòng và an ninh.", "Ban quản lý dự án đầu tư xây dựng của địa phương."], "answer": 2, "source": "Luật Giáo dục nghề nghiệp số 124/2025/QH15 ngày 10/12/2025 của Quốc hội (Công báo số 36 ngày 21/01/2026), Điều 11, khoản 1, điểm e.", "explanation": ""}, {"id": 31, "set": 1, "number": 31, "text": "Theo Điều 22 khoản 1 điểm a Luật Giáo dục nghề nghiệp, giảng viên cao đẳng, giáo viên trung cấp và giáo viên trung học nghề chuyên giảng dạy lý thuyết phải đạt trình độ chuẩn nào?", "level": "Thông hiểu", "options": ["Có bằng tốt nghiệp đại học hoặc tương đương trở lên.", "Có bằng tốt nghiệp cao đẳng trở lên.", "Có bằng thạc sĩ trở lên.", "Có bằng tốt nghiệp trung cấp trở lên."], "answer": 0, "source": "Luật Giáo dục nghề nghiệp số 124/2025/QH15 ngày 10/12/2025 của Quốc hội (Công báo số 36 ngày 21/01/2026), Điều 22, khoản 1, điểm a.", "explanation": ""}, {"id": 32, "set": 1, "number": 32, "text": "Luật Nhà giáo số 73/2025/QH15 có hiệu lực thi hành từ ngày nào?", "level": "Nhận biết", "options": ["01/7/2025", "01/9/2025", "01/01/2026", "01/7/2026"], "answer": 2, "source": "Nguồn: Luật Nhà giáo số 73/2025/QH15, Điều 41 khoản 1; Công báo số 967 + 968 ngày 24/7/2025, trang 75.", "explanation": ""}, {"id": 33, "set": 1, "number": 33, "text": "Luật Nhà giáo được Quốc hội khóa XV thông qua tại kỳ họp thứ mấy?", "level": "Nhận biết", "options": ["Kỳ họp thứ 8", "Kỳ họp thứ 9", "Kỳ họp thứ 10", "Kỳ họp thứ 7"], "answer": 1, "source": "Nguồn: Luật Nhà giáo số 73/2025/QH15, phần ghi nhận thông qua Luật (sau Điều 42); Công báo số 967 + 968 ngày 24/7/2025, trang 75.", "explanation": ""}, {"id": 34, "set": 1, "number": 34, "text": "Nhà giáo nào sau đây được Chính phủ quy định riêng về trình độ chuẩn được đào tạo?", "level": "Thông hiểu", "options": ["Nhà giáo đào tạo, bồi dưỡng trong trường của lực lượng vũ trang", "Giáo viên mầm non trong cơ sở giáo dục công lập", "Giáo viên trung học cơ sở trong cơ sở giáo dục công lập", "Giảng viên giảng dạy chương trình giáo dục đại học"], "answer": 0, "source": "Nguồn: Luật Nhà giáo số 73/2025/QH15, Điều 28 khoản 2; Công báo số 967 + 968 ngày 24/7/2025, trang 70.", "explanation": ""}, {"id": 35, "set": 1, "number": 35, "text": "Việc áp dụng Luật Nhà giáo đối với nhà giáo trong trường của cơ quan nhà nước, tổ chức chính trị, lực lượng vũ trang nhân dân do cơ quan nào quy định?", "level": "Thông hiểu", "options": ["Quốc hội", "Chính phủ", "Bộ Giáo dục và Đào tạo", "Bộ Quốc phòng"], "answer": 1, "source": "Nguồn: Luật Nhà giáo số 73/2025/QH15, Điều 41 khoản 2; Công báo số 967 + 968 ngày 24/7/2025, trang 75.", "explanation": ""}, {"id": 36, "set": 1, "number": 36, "text": "Theo Điều 12 Luật Nhà giáo, chức danh nhà giáo là gì?", "level": "Thông hiểu", "options": ["Mức lương theo từng cấp học, trình độ đào tạo", "Chức vụ quản lý trong cơ sở giáo dục", "Tên gọi thể hiện trình độ, năng lực chuyên môn, nghiệp vụ", "Danh hiệu thi đua, khen thưởng hằng năm"], "answer": 2, "source": "Nguồn: Luật Nhà giáo số 73/2025/QH15, Điều 12 khoản 1; Công báo số 967 + 968 ngày 24/7/2025, trang 62.", "explanation": ""}, {"id": 37, "set": 1, "number": 37, "text": "Theo Nghị quyết số 281/NQ-CP, yêu cầu đổi mới hình thức, phương pháp dạy học môn Giáo dục quốc phòng và an ninh nhằm đạt mục tiêu nào sau đây?", "level": "Nhận biết", "options": ["Giảm thời lượng học tập lý thuyết của môn học", "Nâng cao chất lượng, hiệu quả giáo dục quốc phòng và an ninh.", "Thay thế toàn bộ hoạt động thực hành bằng học trực tuyến.", "Chuyển nội dung môn học thành hoạt động ngoại khóa tự chọn."], "answer": 1, "source": "Nghị quyết số 281/NQ-CP ngày 15/9/2025; Chương trình hành động kèm theo, phần II, mục 3, điểm a, trang 5.", "explanation": ""}, {"id": 38, "set": 1, "number": 38, "text": "Theo Nghị quyết số 71-NQ/TW, quan điểm nào thể hiện đúng vai trò của người học và nhà giáo trong quá trình giáo dục?", "level": "Nhận biết", "options": ["Người học là trung tâm, nhà giáo là động lực quyết định chất lượng giáo dục.", "Người học chủ yếu tiếp nhận kiến thức, nhà giáo chỉ thực hiện nhiệm vụ quản lý.", "Nhà trường chịu trách nhiệm toàn bộ, không cần phối hợp với gia đình và xã hội.", "Hoạt động giáo dục chủ yếu tập trung vào truyền đạt kiến thức lý thuyết."], "answer": 0, "source": "Nghị quyết số 71-NQ/TW ngày 22/8/2025 của Bộ Chính trị; Mục I, quan điểm chỉ đạo, khoản 3 trang 2", "explanation": ""}, {"id": 39, "set": 1, "number": 39, "text": "Theo Nghị quyết số 281/NQ-CP, việc ứng dụng công nghệ số và trí tuệ nhân tạo trong giáo dục cần đáp ứng yêu cầu nào?", "level": "Nhận biết", "options": ["Sử dụng công nghệ để thay thế hoàn toàn vai trò của giáo viên.", "Chỉ ứng dụng công nghệ trong công tác quản lý nhà trường.", "Ứng dụng công nghệ số, trí tuệ nhân tạo có kiểm soát trong quản lý, dạy học và đánh giá.", "Chỉ sử dụng công nghệ đối với những môn học có nội dung lý thuyết."], "answer": 2, "source": "Nghị quyết số 281/NQ-CP ngày 15/9/2025; Chương trình hành động kèm theo, phần II, mục 4, điểm a, trang 5-6.", "explanation": ""}, {"id": 40, "set": 1, "number": 40, "text": "Trong công tác giáo dục đạo đức, nhân cách cho học sinh, vì sao cần có sự phối hợp giữa gia đình, nhà trường và xã hội?", "level": "Thông hiểu", "options": ["Vì nhà trường có thể chuyển toàn bộ trách nhiệm giáo dục cho gia đình.", "Vì sự phối hợp giúp thống nhất trách nhiệm, tạo môi trường giáo dục toàn diện và hình thành nhân cách tốt cho học sinh.", "Vì gia đình chỉ cần quan tâm đến kết quả học tập, còn nhà trường chịu trách nhiệm giáo dục đạo đức.", "Vì các hoạt động giáo dục ngoài nhà trường không cần sự tham gia của giáo viên."], "answer": 1, "source": "Nghị quyết số 281/NQ-CP ngày 15/9/2025; Chương trình hành động kèm theo; Phần II, mục 3, điểm a.Trang 5.", "explanation": ""}, {"id": 41, "set": 2, "number": 41, "text": "Theo Nghị quyết số 71-NQ/TW, nội dung giáo dục quốc phòng và an ninh cần được chú trọng như thế nào trong quá trình đổi mới giáo dục?", "level": "Thông hiểu", "options": ["Chỉ tổ chức giáo dục quốc phòng và an ninh trong các buổi hoạt động ngoại khóa.", "Đổi mới nội dung, phương thức giảng dạy, nâng cao chất lượng và hiệu quả giáo dục quốc phòng và an ninh.", "Tập trung giáo dục quốc phòng và an ninh đối với học sinh cuối cấp.", "Chỉ lồng ghép nội dung quốc phòng và an ninh trong các môn học có liên quan."], "answer": 1, "source": "Nghị quyết số 71-NQ/TW ngày 22/8/2025 của Bộ Chính trị về đột phá phát triển giáo dục và đào tạo; Phần III – Nhiệm vụ, giải pháp; mục 3 – Tăng cường giáo dục toàn diện đức, trí, thể, mỹ, hình thành hệ giá trị con người Việt Nam thời đại mới; Trang 7.", "explanation": ""}, {"id": 42, "set": 2, "number": 42, "text": "Theo Điều 1 Nghị quyết số 248/2025/QH15 của Quốc hội, Nghị quyết này quy định về nội dung nào sau đây?", "level": "Nhận biết", "options": ["Một số cơ chế, chính sách đặc thù, vượt trội để thực hiện đột phá phát triển giáo dục và đào tạo.", "Toàn bộ hệ thống giáo dục quốc dân và tổ chức bộ máy quản lý nhà nước về giáo dục.", "Quy chế tuyển sinh và thi tốt nghiệp trung học phổ thông trong phạm vi cả nước.", "Chế độ tiền lương, phụ cấp của công chức, viên chức trong cơ quan quản lý giáo dục."], "answer": 0, "source": "Nghị quyết số 248/2025/QH15 ngày 10/12/2025 của Quốc hội, Điều 1, khoản 1; trang 1.", "explanation": ""}, {"id": 43, "set": 2, "number": 43, "text": "Theo Điều 1 Nghị quyết số 248/2025/QH15, Nghị quyết này áp dụng đối với đối tượng nào?", "level": "Nhận biết", "options": ["Chỉ các cơ sở giáo dục công lập thuộc hệ thống giáo dục quốc dân.", "Chỉ các cơ sở giáo dục đại h wer": 0, "source": "Nghị quyết số 248/2025/QH15 ngày 10/12/2025 của Quốc hội, Điều 2, khoản 2, điểm b; trang 2.", "explanation": ""}, {"id": 50, "set": 2, "number": 50, "text": "Theo Điều 3 khoản 1 Nghị quyết số 248/2025/QH15, Nhà nước bảo đảm nguồn lực để thực hiện chính sách nào đối với môn học Giáo dục quốc phòng và an ninh tại cơ sở giáo dục nghề nghiệp, giáo dục đại học theo lộ trình do Chính phủ quy định?", "level": "Thông hiểu", "options": ["Miễn học phí chỉ đối với sinh viên các trường sư phạm.", "Miễn học phí và giáo trình môn học Giáo dục quốc phòng và an ninh.", "Miễn toàn bộ chi phí ăn, ở của người học trong thời gian học tập trung.", "Cấp học bổng cho người học đạt kết quả cao ở môn học này."], "answer": 1, "source": "Nghị quyết số 248/2025/QH15 ngày 10/12/2025 của Quốc hội, Điều 3, khoản 1 (đoạn thứ hai); trang 2.", "explanation": ""}, {"id": 51, "set": 2, "number": 51, "text": "Theo Thông tư số 22/2021/TT-BGDĐT, Đối với môn học có 35 tiết/năm học được đánh giá bằng nhận xét kết hợp đánh giá bằng điểm số thì có bao nhiêu điểm đánh giá thường xuyên?", "level": "Nhận biết", "options": ["04 điểm đánh giá thường xuyên", "03 điểm đánh giá thường xuyên", "02 điểm đánh giá thường xuyên", "05 điểm đánh giá thường xuyên"], "answer": 2, "source": "Chương II, Điều 6, Thông tư số 22/2021/TT-BGDĐT ngày 20/7/2021 của Bộ GDĐT.", "explanation": ""}, {"id": 52, "set": 2, "number": 52, "text": "Thông tư số 22/2021/TT-BGDĐT quy định về đánh giá học sinh trung học cơ sở và học sinh trung học phổ thông được ban hành ngày tháng năm nào?", "level": "Nhận biết", "options": ["18/7/2021", "20/7/2021", "20/8/2021", "21/9/2021"], "answer": 1, "source": "Thông tư số 22/2021/TT-BGDĐT ban hành ngày 20/7/2021 của Bộ GDĐT.", "explanation": ""}, {"id": 53, "set": 2, "number": 53, "text": "Theo Thông tư số 22/2021/TT-BGDĐT, kết quả rèn luyện và học tập môn Giáo dục quốc phòng và an ninh cấp Trung học phổ thông được đánh giá bằng hình thức nào?", "level": "Nhận biết", "options": ["Kết hợp nhận xét và điểm số", "Đánh giá bằng nhận xét", "Đánh giá bằng điểm số", "Tính theo thang điểm chữ"], "answer": 2, "source": "Điều 5, Thông tư số 22/2021/TT-BGDĐT ngày 20/7/2021 của Bộ GDĐT.", "explanation": ""}, {"id": 54, "set": 2, "number": 54, "text": "Theo Thông tư số 22/2021/TT-BGDĐT tại điều 6 đánh giá thường xuyên đối với một môn học, mỗi học sinh được kiểm tra đánh giá như thế nào?", "level": "Thông hiểu", "options": ["Đánh giá một lần", "Đánh giá hai lần", "Đánh giá ba lần", "Đánh giá nhiều lần"], "answer": 3, "source": "chương II, điều 6, mục 2 tại Thông tư số 22/2021/TT-BGDĐT ban hành ngày 20/7/2021 của Bộ GDĐT.", "explanation": ""}, {"id": 55, "set": 2, "number": 55, "text": "Lực lượng vũ trang nhân dân Việt Nam gồm mấy thành phần chính?", "level": "Thông hiểu", "options": ["Ba thành phần chính", "Năm thành phần chính", "Bốn thành phần chính", "Bảy thành phần chính"], "answer": 0, "source": "Mục tóm tắt trang 11-SGK GDQP-AN lớp 10 KNTT", "explanation": ""}, {"id": 56, "set": 2, "number": 56, "text": "Những vật có thể che giấu được hành động, nhưng không thể chống đỡ được đạn bắn thẳng, mảnh bom, pháo, cối, lựu đạn xuyên qua như bụi cây, bụi cỏ rậm rạp, mành, rèm… là định nghĩa của địa hình, địa vật gì?", "level": "Thông hiểu", "options": ["Vật che đỡ", "Vật che khuất", "Vật che giấu", "Địa hình trống trải"], "answer": 1, "source": "Mục I-1, bài 8, SGK GDQP-AN lớp 11 KNTT – trang 50", "explanation": ""}, {"id": 57, "set": 2, "number": 57, "text": "Có các trường hợp sau: ông H là trưởng thôn; bà K là đảng viên Đảng Cộng sản Việt Nam; ông L là người quản lý công ty trách nhiệm hữu hạn tư nhân quy mô nhỏ; bà M là đại biểu Hội đồng nhân dân. Theo Điều 14 khoản 2 Luật Giáo dục quốc phòng và an ninh, những ai thuộc đối tượng bồi dưỡng kiến thức quốc phòng và an ninh trong cơ quan, tổ chức của Nhà nước, tổ chức chính trị, tổ chức chính trị - xã hội?", "level": "Vận dụng", "options": ["Ông H, ông L và bà M.", "Bà K và ông L.", "Ông H, bà K và bà M.", "Ông H và bà K."], "answer": 2, "source": "Luật Giáo dục quốc phòng và an ninh số 30/2013/QH13 (Văn bản hợp nhất số 48/VBHN-VPQH ngày 17/3/2026 của Văn phòng Quốc hội), Điều 14, khoản 2 (điểm b, d, đ) (điểm d sửa đổi bởi khoản 1 Điều 11 Luật số 98/2025/QH15).", "explanation": ""}, {"id": 58, "set": 2, "number": 58, "text": "Ông T là người quản lý công ty tư nhân quy mô vừa; ông U là người quản lý doanh nghiệp tư nhân quy mô nhỏ hoạt động phục vụ quốc phòng và an ninh; ông V là người quản lý doanh nghiệp tư nhân quy mô siêu nhỏ kinh doanh dịch vụ tại đô thị; bà X là người quản lý đơn vị sự nghiệp ngoài công lập. Theo Điều 15 Luật Giáo dục quốc phòng và an ninh, những ai phải tham gia bồi dưỡng kiến thức quốc phòng và an ninh?", "level": "Vận dụng", "options": ["Ông T, ông U và bà X.", "Ông T, ông V và bà X.", "Ông U, ông V và bà X.", "Ông T và ông U."], "answer": 0, "source": "Luật Giáo dục quốc phòng và an ninh số 30/2013/QH13 (Văn bản hợp nhất số 48/VBHN-VPQH ngày 17/3/2026 của Văn phòng Quốc hội), Điều 15, khoản 1 (điểm a, b) và khoản 2.", "explanation": ""}, {"id": 59, "set": 2, "number": 59, "text": "Anh D tốt nghiệp đại học chuyên ngành Giáo dục thể chất và muốn trở thành giảng viên giáo dục quốc phòng và an ninh. Theo Điều 23 khoản 2 Luật Giáo dục quốc phòng và an ninh, anh D cần có thêm giấy tờ nào?", "level": "Vận dụng", "options": ["Chỉ cần chứng chỉ bồi dưỡng nghiệp vụ sư phạm.", "Chứng chỉ bồi dưỡng nghiệp vụ sư phạm và chứng chỉ đào tạo giáo viên, giảng viên giáo dục quốc phòng và an ninh.", "Không cần thêm giấy tờ nào vì đã có bằng tốt nghiệp đại học.", "Phải có bằng thạc sĩ chuyên ngành giáo dục quốc phòng và an ninh."], "answer": 1, "source": "Luật Giáo dục quốc phòng và an ninh số 30/2013/QH13 (Văn bản hợp nhất số 48/VBHN-VPQH ngày 17/3/2026 của Văn phòng Quốc hội), Điều 23, khoản 2.", "explanation": ""}, {"id": 60, "set": 2, "number": 60, "text": "Bà S là công chức cấp tỉnh, được triệu tập tham gia bồi dưỡng kiến thức quốc phòng và an ninh ở nơi xa nơi cư trú. Theo Điều 18 khoản 1 Luật Giáo dục quốc phòng và an ninh, bà S được hưởng chế độ nào?", "level": "Vận dụng", "options": ["Chỉ được thanh toán tiền tàu, xe một lần đi, về, không hưởng nguyên lương và phụ cấp.", "Hưởng nguyên lương, phụ cấp, nhưng toàn bộ chi phí đi lại và ăn ở do bà S tự chi trả.", "Hưởng nguyên lương, phụ cấp; được bố trí nơi nghỉ, hỗ trợ phương tiện hoặc thanh toán tiền tàu, xe một lần đi, về và hỗ trợ tiền ăn do ngân sách nhà nước bảo đảm.", "Không hưởng chế độ nào vì bồi dưỡng kiến thức quốc phòng và an ninh là trách nhiệm của công dân."], "answer": 2, "source": "Luật Giáo dục quốc phòng và an ninh số 30/2013/QH13 (Văn bản hợp nhất số 48/VBHN-VPQH ngày 17/3/2026 của Văn phòng Quốc hội), Điều 18, khoản 1.", "explanation": ""}, {"id": 61, "set": 2, "number": 61, "text": "Anh K là sinh viên sư phạm, được Nhà nước hỗ trợ tiền đóng học phí và chi phí sinh hoạt trong toàn khóa học. Sau 02 năm kể từ khi tốt nghiệp, anh K không công tác trong ngành giáo dục. Theo Điều 85 Luật Giáo dục, anh K phải thực hiện nghĩa vụ nào sau đây?", "level": "Vận dụng", "options": ["Không phải bồi hoàn vì anh K đã hoàn thành khóa học sư phạm.", "Chỉ phải bồi hoàn khoản học phí, không phải bồi hoàn chi phí sinh hoạt.", "Phải bồi hoàn khoản kinh phí Nhà nước đã hỗ trợ; thời hạn hoàn trả tối đa bằng thời gian đào tạo.", "Phải bồi hoàn gấp đôi khoản kinh phí mà Nhà nước đã hỗ trợ."], "answer": 2, "source": "Luật Giáo dục số 43/2019/QH14, Điều 85, khoản 4; Văn bản hợp nhất số 72/VBHN-VPQH; trang 36.", "explanation": ""}, {"id": 62, "set": 2, "number": 62, "text": "Địa phương X dự kiến thành lập một trường phổ thông có hai cấp học là trung học cơ sở và trung học phổ thông (cấp học cao nhất là trung học phổ thông). Theo Điều 52 Luật Giáo dục (sửa đổi, bổ sung năm 2025), ai có thẩm quyền quyết định thành lập trường này?", "level": "Vận dụng", "options": ["Chủ tịch Ủy ban nhân dân cấp xã.", "Giám đốc Sở Giáo dục và Đào tạo.", "Bộ trưởng Bộ Giáo dục và Đào tạo.", "Chủ tịch Ủy ban nhân dân cấp tỉnh."], "answer": 3, "source": "Luật Giáo dục số 43/2019/QH14, Điều 52, khoản 2, điểm b (sửa đổi bởi khoản 15 Điều 1 Luật số 123/2025/QH15, có hiệu lực từ 01/7/2026); Văn bản hợp nhất số 72/VBHN-VPQH; trang 22.", "explanation": ""}, {"id": 63, "set": 2, "number": 63, "text": "Ông B là viên chức của một viện nghiên cứu công lập (đơn vị sự nghiệp công lập không phải là cơ sở giáo dục công lập), có trình độ chuyên môn cao, được một trường cao đẳng công lập mời thực hiện nhiệm vụ giảng dạy và nghiên cứu như giảng viên cơ hữu. Theo Điều 21 Luật Giáo dục nghề nghiệp, ông B thuộc loại nhà giáo nào?", "level": "Vận dụng", "options": ["Giảng viên thỉnh giảng.", "Giảng viên hợp đồng toàn thời gian sau khi nghỉ hưu.", "Giảng viên cơ hữu.", "Giảng viên đồng cơ hữu."], "answer": 3, "source": "Luật Giáo dục nghề nghiệp số 124/2025/QH15 ngày 10/12/2025 của Quốc hội (Công báo số 36 ngày 21/01/2026), Điều 21, khoản 2 và khoản 3.", "explanation": ""}, {"id": 64, "set": 2, "number": 64, "text": "Thầy A là giáo viên GDQPAN trường trung học phổ thông công lập. Khi chấm bài kiểm tra, thầy cố ý nâng điểm cho một số học sinh chưa đạt yêu cầu. Hành vi này vi phạm điều cấm nào đối với nhà giáo?", "level": "Vận dụng", "options": ["Cố ý làm sai lệch kết quả đánh giá người học", "Ép buộc người học nộp tiền ngoài quy định", "Ép buộc người học tham gia học thêm", "Lợi dụng chức danh để thu lợi bất chính"], "answer": 0, "source": "Nguồn: Luật Nhà giáo số 73/2025/QH15, Điều 11 khoản 2 điểm b; Công báo số 967 + 968 ngày 24/7/2025, trang 62.", "explanation": ""}, {"id": 65, "set": 2, "number": 65, "text": "Thầy K, giáo viên GDQPAN, được bổ nhiệm Phó Hiệu trưởng và vẫn giảng dạy đủ định mức theo quy định. Theo Luật Nhà giáo, thầy K được hưởng chế độ nào?", "level": "Vận dụng", "options": ["Chế độ của chức vụ quản lý và chế độ của nhà giáo", "Chỉ chế độ của chức vụ quản lý", "Chỉ chế độ của nhà giáo", "Chế độ của viên chức hành chính"], "answer": 0, "source": "Nguồn: Luật Nhà giáo số 73/2025/QH15, Điều 21 khoản 2; Công báo số 967 + 968 ngày 24/7/2025, trang 67.", "explanation": ""}, {"id": 66, "set": 2, "number": 66, "text": "Trong giờ học GDQPAN, giáo viên sử dụng công cụ trí tuệ nhân tạo (AI) để hỗ trợ xây dựng tình huống học tập. Tuy nhiên, một số nội dung AI đưa ra chưa chính xác với kiến thức trong tài liệu chính thống. Giáo viên nên xử lý như thế nào?", "level": "Vận dụng", "options": ["Giữ nguyên nội dung do AI tạo ra để tiết kiệm thời gian chuẩn bị bài.", "Kiểm tra, đối chiếu thông tin với tài liệu chính thống và điều chỉnh trước khi sử dụng.", "Yêu cầu học sinh tự lựa chọn thông tin AI đưa ra mà không cần kiểm chứng.", "Ngừng sử dụng toàn bộ phương tiện công nghệ trong dạy học."], "answer": 1, "source": "Nghị quyết số 281/NQ-CP ngày 15/9/2025, Phần II, mục 4, điểm a, trang 6.\nNghị quyết số 71-NQ/TW ngày 22/8/2025, Phần III, mục 4, trang 7.", "explanation": ""}, {"id": 67, "set": 2, "number": 67, "text": "Cô P là giáo viên trường tiểu học công lập ở xã thuộc vùng có điều kiện kinh tế - xã hội đặc biệt khó khăn; anh Q là nhân viên thư viện của cùng trường; cô R là giáo viên trường trung học cơ sở công lập ở phường nội thành, không thuộc khu vực đặc biệt khó khăn. Theo Điều 2 khoản 2 điểm a Nghị quyết số 248/2025/QH15 (thực hiện theo lộ trình do Chính phủ quy định), mức phụ cấp ưu đãi nghề tối thiểu của cô P, anh Q, cô R lần lượt là bao nhiêu?", "level": "Vận dụng", "options": ["70%, 30%, 70%.", "100%, 70%, 70%.", "100%, 30%, 30%.", "100%, 30%, 70%."], "answer": 3, "source": "Nghị quyết số 248/2025/QH15 ngày 10/12/2025 của Quốc hội, Điều 2, khoản 2, điểm a; trang 2.", "explanation": ""}, {"id": 68, "set": 2, "number": 68, "text": "Trường đại học công lập Y muốn tuyển dụng, ký hợp đồng lao động với ông T, là người Việt Nam định cư ở nước ngoài, có trình độ tiến sĩ, để giảng dạy và nghiên cứu khoa học. Theo Điều 2 khoản 1 điểm c Nghị quyết số 248/2025/QH15, nhận định nào sau đây đúng?", "level": "Vận dụng", "options": ["Trường được tự chủ xác định vị trí việc làm, tuyển dụng, ký hợp đồng lao động với ông T theo quy chế nội bộ của đơn vị.", "Trường phải đề nghị Giám đốc Sở Giáo dục và Đào tạo tuyển dụng ông T thay cho nhà trường.", "Trường chỉ được ký hợp đồng lao động sau khi có quyết định của Chủ tịch Ủy ban nhân dân cấp xã.", "Trường không được ký hợp đồng lao động với người đang định cư ở nước ngoài."], "answer": 0, "source": "Nghị quyết số 248/2025/QH15 ngày 10/12/2025 của Quốc hội, Điều 2, khoản 1, điểm c; trang 2.", "explanation": ""}, {"id": 69, "set": 2, "number": 69, "text": "Khi địch ở xa, địa hình địa vật che khuất, che đỡ cao tầm ngang ngực chiến sĩ nên thực hiện động tác ném lựu đạn nào để đảm bảo an toàn?", "level": "Vận dụng", "options": ["Quỳ ném lựu đạn", "Đứng ném lựu đạn", "Chạy ném lựu đạn", "Nằm ném lựu đạn"], "answer": 1, "source": "Mục II-2a, bài 10, SGK GDQP-AN lớp 11 KNTT – trang 62,63.", "explanation": ""}, {"id": 70, "set": 2, "number": 70, "text": "Khi ở gần địch và địa hình hạn chế (chiều cao vật che đỡ 60-80cm) chiến sĩ nên thực hiện động tác ném lựu đạn nào để đảm bảo an toàn?", "level": "Vận dụng", "options": ["Chạy ném lựu đạn", "Đứng ném lựu đạn", "Quỳ ném lựu đạn", "Nằm ném lựu đạn"], "answer": 2, "source": "Mục II-2a, bài 10, SGK GDQP-AN lớp 11 KNTT – trang 63", "explanation": ""}, {"id": 71, "set": 2, "number": 71, "text": "Theo thông tư 22/2021/TT-BGDĐT việc đánh giá định kì đối với môn học có từ 70 tiết/năm học trở xuống (không bao gồm cụm chuyên đề học tập) thời gian làm bài kiểm tra là bao nhiêu phút?", "level": "Vận dụng", "options": ["45 phút", "60 phút", "90 phút", "120 phút"], "answer": 0, "source": "Chương I điều 7, trang 4 - TT 22/2021/TT-BGDĐT", "explanation": ""}, {"id": 72, "set": 2, "number": 72, "text": "Môn Giáo dục quốc phòng và an ninh góp phần hình thành, phát triển ở học sinh các năng lực đặc thù của môn học là?", "level": "Vận dụng", "options": ["Năng lực nhận thức các vấn đề quốc phòng, an ninh và năng lực vận dụng các kiến thức, kĩ năng quân sự đã học vào cuộc sống.", "Năng lực hiểu biết các vấn đề quốc phòng, an ninh và năng lực vận dụng các kiến thức, kĩ năng quân sự đã học vào cuộc sống.", "Năng lực chung về vấn đề quốc phòng, an ninh và năng lực vận dụng các kiến thức, kĩ năng quân sự đã học vào cuộc sống.", "Năng lực nhận thức các vấn đề quốc phòng, an ninh và năng lực vận dụng các kiến thức."], "answer": 0, "source": "Chương IV, mục 2, trang 5 - TT 46/2020/TT-BGDĐT", "explanation": ""}, {"id": 73, "set": 2, "number": 73, "text": "Cho các nhận định về trung tâm giáo dục quốc phòng và an ninh theo Luật Giáo dục quốc phòng và an ninh:\n(1) Quy hoạch hệ thống trung tâm giáo dục quốc phòng và an ninh phải phù hợp với quy hoạch mạng lưới cơ sở giáo dục đại học và giáo dục nghề nghiệp công lập.\n(2) Thủ tướng Chính phủ quyết định thành lập trung tâm giáo dục quốc phòng và an ninh thuộc cơ sở giáo dục đại học.\n(3) Bộ Quốc phòng quyết định thành lập trung tâm giáo dục quốc phòng và an ninh thuộc nhà trường quân đội.\n(4) Bộ trưởng Bộ Giáo dục và Đào tạo phê duyệt quy hoạch hệ thống và quy định điều kiện thành lập trung tâm giáo dục quốc phòng và an ninh.\nNhững nhận định nào đúng?", "level": "Vận dụng cao", "options": ["Chỉ (1) và (2).", "Chỉ (1) và (3).", "Chỉ (2) và (4).", "Chỉ (3) và (4)."], "answer": 1, "source": "Luật Giáo dục quốc phòng và an ninh số 30/2013/QH13 (Văn bản hợp nhất số 48/VBHN-VPQH ngày 17/3/2026 của Văn phòng Quốc hội), Điều 8, khoản 3 và khoản 4; Điều 34, khoản 2; Điều 36, khoản 7 (Điều 8 khoản 3 sửa đổi bởi khoản 4 Điều 55 Luật Quy hoạch số 112/2025/QH15).", "explanation": ""}, {"id": 74, "set": 2, "number": 74, "text": "Cho các nhận định về Hội đồng giáo dục quốc phòng và an ninh theo Điều 44 Luật Giáo dục quốc phòng và an ninh:\n(1) Hội đồng được thành lập ở trung ương, quân khu, cấp tỉnh, cấp huyện.\n(2) Hội đồng làm việc theo chế độ chuyên trách.\n(3) Cơ quan thường trực Hội đồng ở cấp xã là Ban chỉ huy quân sự cấp xã.\n(4) Hội đồng có chức năng phối hợp liên ngành làm tham mưu, tư vấn cho Đảng, chính quyền các cấp về công tác giáo dục quốc phòng và an ninh.\nNhững nhận định nào đúng?", "level": "Vận dụng cao", "options": ["Chỉ (1) và (2).", "Chỉ (1) và (4).", "Chỉ (2) và (3).", "Chỉ (3) và (4)."], "answer": 3, "source": "Luật Giáo dục quốc phòng và an ninh số 30/2013/QH13 (Văn bản hợp nhất số 48/VBHN-VPQH ngày 17/3/2026 của Văn phòng Quốc hội), Điều 44, khoản 1, 2 và 3 (khoản 1, khoản 3 sửa đổi bởi khoản 7 Điều 11 Luật số 98/2025/QH15).", "explanation": ""}, {"id": 75, "set": 2, "number": 75, "text": "Cho các nhận định về nhiệm vụ, quyền hạn của Bộ Giáo dục và Đào tạo theo Điều 36 Luật Giáo dục quốc phòng và an ninh:\n(1) Chủ trì, phối hợp với Bộ Quốc phòng, Bộ Công an hướng dẫn giáo dục quốc phòng và an ninh trong trường tiểu học, trung học cơ sở.\n(2) Quyết định thành lập trung tâm giáo dục quốc phòng và an ninh thuộc nhà trường quân đội.\n(3) Chủ trì, phối hợp với Bộ Nội vụ, Bộ Tài chính và bộ, cơ quan ngang bộ có liên quan quy định chế độ, chính sách cho cán bộ quản lý, giáo viên, giảng viên giáo dục quốc phòng và an ninh.\n(4) Chủ trì, phối hợp với Bộ Quốc phòng, Bộ Nội vụ quy định định mức giáo viên giáo dục quốc phòng và an ninh trong trường trung học phổ thông, cơ sở giáo dục nghề nghiệp, giáo dục đại học.\nNhững nhận định nào đúng?", "level": "Vận dụng cao", "options": ["(1), (2) và (3).", "(2), (3) và (4).", "(1), (3) và (4).", "(1), (2) và (4)."], "answer": 2, "source": "Luật Giáo dục quốc phòng và an ninh số 30/2013/QH13 (Văn bản hợp nhất số 48/VBHN-VPQH ngày 17/3/2026 của Văn phòng Quốc hội), Điều 36, khoản 2, 4, 5; Điều 34, khoản 2 (khoản 2, khoản 4 sửa đổi bởi khoản 3, khoản 4 Điều 11 Luật số 98/2025/QH15).", "explanation": ""}, {"id": 76, "set": 2, "number": 76, "text": "Cho các nhận định về học phí theo Điều 99 Luật Giáo dục (sửa đổi, bổ sung năm 2025):\n(1) Trẻ em mầm non, học sinh phổ thông trong cơ sở giáo dục công lập được miễn học phí.\n(2) Hội đồng nhân dân cấp tỉnh quyết định mức học phí cụ thể làm căn cứ thực hiện miễn học phí đối với trẻ em mầm non, học sinh phổ thông trong cơ sở giáo dục công lập.\n(3) Ủy ban nhân dân cấp tỉnh quyết định mức hỗ trợ học phí đối với học sinh trong cơ sở giáo dục dân lập, tư thục.\n(4) Cơ sở giáo dục dân lập, tư thục được quyền chủ động xây dựng mức thu học phí bảo đảm bù đắp chi phí và có tích lũy.\nNhững nhận định nào đúng?", "level": "Vận dụng cao", "options": ["(1), (2) và (3).", "(1), (2) và (4).", "(2), (3) và (4).", "(1), (3) và (4)."], "answer": 1, "source": "Luật Giáo dục số 43/2019/QH14, Điều 99, khoản 3 và khoản 4 (điểm b, điểm đ) (sửa đổi bởi khoản 24 Điều 1 Luật số 123/2025/QH15); Văn bản hợp nhất số 72/VBHN-VPQH; trang 41 – 42.", "explanation": ""}, {"id": 77, "set": 2, "number": 77, "text": "Cho các nhận định về cơ sở giáo dục nghề nghiệp theo Luật Giáo dục nghề nghiệp số 124/2025/QH15:\n(1) Đối với cơ sở giáo dục nghề nghiệp công lập, cơ quan quản lý cơ sở giáo dục nghề nghiệp bổ nhiệm, miễn nhiệm hiệu trưởng.\n(2) Đối với cơ sở giáo dục nghề nghiệp tư thục, hội đồng trường bổ nhiệm, miễn nhiệm hiệu trưởng.\n(3) Hội đồng trường là bộ phận trong cơ cấu tổ chức của mọi cơ sở giáo dục nghề nghiệp, kể cả cơ sở công lập.\n(4) Nhà đầu tư bầu hoặc cử, miễn nhiệm chủ tịch và thành viên hội đồng trường của cơ sở giáo dục nghề nghiệp tư thục.\nNhững nhận định nào đúng?", "level": "Vận dụng cao", "options": ["(1), (2) và (3).", "(2), (3) và (4).", "(1), (2) và (4).", "(1), (3) và (4)."], "answer": 2, "source": "Luật Giáo dục nghề nghiệp số 124/2025/QH15 ngày 10/12/2025 của Quốc hội (Công báo số 36 ngày 21/01/2026), Điều 11, khoản 1, điểm b; Điều 12, khoản 2; Điều 13, khoản 4.", "explanation": ""}, {"id": 78, "set": 2, "number": 78, "text": "Khi chuẩn bị bài thực hành GDQPAN, giáo viên sử dụng nền tảng AI để thiết kế tình huống mô phỏng. Nội dung mô phỏng có hình ảnh trực quan nhưng xuất hiện một số chi tiết không phù hợp với kiến thức chuyên môn và có thể khiến học sinh hiểu sai thao tác thực hành. Trong khi đó, nhà trường yêu cầu tăng cường ứng dụng công nghệ số trong dạy học. Giáo viên nên lựa chọn phương án nào để vừa thực hiện chuyển đổi số, vừa bảo đảm chất lượng chuyên môn?", "level": "Vận dụng cao", "options": ["Tiếp tục sử dụng toàn bộ mô phỏng vì đây là sản phẩm công nghệ mới, sau đó giải thích những điểm chưa phù hợp nếu học sinh thắc mắc.", "Loại bỏ toàn bộ công nghệ số, chỉ sử dụng phương pháp thuyết trình để tránh phát sinh sai sót trong bài học.", "Cho học sinh tự phát hiện và điều chỉnh các chi tiết sai trong mô phỏng, không cần giáo viên kiểm tra trước vì đây là hoạt động phát huy tính chủ động.", "Thẩm định nội dung mô phỏng, đối chiếu với tài liệu chuyên môn, điều chỉnh hoặc loại bỏ chi tiết sai; sau đó kết hợp mô phỏng đã được kiểm chứng với hướng dẫn và luyện tập thực tế."], "answer": 3, "source": "Nghị quyết số 281/NQ-CP ngày 15/9/2025, Chương trình hành động của Chính phủ, Phần II, mục 4, điểm a, trang 6.\nNghị quyết số 71-NQ/TW ngày 22/8/2025, Phần III, mục 5, trang 8", "explanation": ""}, {"id": 79, "set": 2, "number": 79, "text": "Cho các nhận định theo Nghị quyết số 248/2025/QH15:\n(1) Phụ cấp ưu đãi nghề đối với giáo viên cơ sở giáo dục mầm non, giáo dục phổ thông công lập được thực hiện theo lộ trình do Chính phủ quy định, với mức tối thiểu 70%.\n(2) Cơ sở giáo dục nghề nghiệp, giáo dục đại học được tự chủ quyết định mức thu nhập tăng thêm cho nhà giáo từ toàn bộ ngân sách nhà nước cấp chi thường xuyên.\n(3) Bộ trưởng Bộ Giáo dục và Đào tạo quyết định một bộ sách giáo khoa giáo dục phổ thông sử dụng thống nhất toàn quốc, thực hiện từ năm học 2025 - 2026.\n(4) Nhà nước bảo đảm nguồn lực để miễn học phí và giáo trình môn học Giáo dục quốc phòng và an ninh tại cơ sở giáo dục nghề nghiệp, giáo dục đại học theo lộ trình do Chính phủ quy định, phù hợp với khả năng cân đối ngân sách nhà nước.\nNhững nhận định nào đúng?", "level": "Vận dụng cao", "options": ["Chỉ (1) và (4).", "Chỉ (2) và (3).", "Chỉ (1) và (3).", "Chỉ (3) và (4)."], "answer": 0, "source": "Nghị quyết số 248/2025/QH15 ngày 10/12/2025 của Quốc hội, Điều 2, khoản 2 (điểm a, điểm b); Điều 3, khoản 1; trang 2.", "explanation": ""}, {"id": 80, "set": 2, "number": 80, "text": "Học sinh gặp khó khăn trong học tập do mắc bệnh mãn tính, bị khuyết tật, bị tai nạn hoặc bị bệnh phải điều trị được miễn học phần thực hành môn Giáo dục thể chất, Giáo dục quốc phòng và an ninh thì hồ sơ xin miễn học thực hành môn Giáo dục thể chất, Giáo dục quốc phòng và an ninh gồm?", "level": "Vận dụng cao", "options": ["Đơn xin miễn học của học sinh và bản cam kết của gia đình học sinh", "Đơn xin miễn học của học sinh và bệnh án hoặc giấy chứng nhận thương tật do bệnh viện từ cấp huyện trở lên cấp.", "Đơn xin miễn học của học sinh và xác nhận của xã, phường", "Đơn xin miễn học của học sinh và kết quả học tập năm học trước"], "answer": 1, "source": "Chương I điều 10 mục 2, trang 7 - TT 22/2021/TT-BGDĐT", "explanation": ""}];</script><script>const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='gdqp-de-xuat-80-20261120-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{wrong:[],bookmarks:[],history:[]}}catch{db={wrong:[],bookmarks:[],history:[]}}let active=null,timer=null;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}};const bank=QUESTIONS.filter(q=>!q.placeholder);const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function dashboard(){clearInterval(timer);active=null;$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">GDQP&AN · Tài liệu ôn luyện được cung cấp</div><h1>Ôn luyện bộ câu hỏi đề xuất</h1><p>80 câu theo tài liệu · Chia hai phần: câu 1–40 và câu 41–80. Luyện từng câu, tra cứu tài liệu và xem lại kết quả.</p><button class="lime" data-start="practice">Luyện tổng hợp 80 câu →</button></div><div class="emblem">★<small>ÔN TẬP KIẾN THỨC</small></div></section><section class="stats"><div class="stat"><strong>80</strong><span class="muted">Câu hỏi đầy đủ</span></div><div class="stat"><strong>${db.history.length}</strong><span class="muted">Lượt đã hoàn thành</span></div><div class="stat"><strong>${db.wrong.length}</strong><span class="muted">Câu cần ôn lại</span></div><div class="stat"><strong>${db.bookmarks.length}</strong><span class="muted">Câu đã đánh dấu</span></div></section><div class="notice">Nội dung, đáp án và nguồn dẫn được nhập từ file anh cung cấp, chưa thẩm định lại. Nguồn đối chiếu được hiển thị khi kiểm tra đáp án. Đáp án được lấy từ hàng phương án có ghi “Đáp án đúng” trong bảng gốc. Hai phần là cách chia để thuận tiện ôn luyện, không phải hai đề riêng trong tài liệu. Vị trí phương án được đảo khi luyện. Thời gian thi thử do anh chọn, không phải thời gian quy định trong tài liệu.</div><div class="panel"><h3>Thiết lập thời gian mỗi đề</h3><select id="duration" aria-label="Thời gian thi thử"><option value="40" selected>40 phút</option><option value="50">50 phút</option><option value="60">60 phút</option></select></div><h2 style="margin-top:25px">Chọn phần ôn tập</h2><section class="grid">${[1,2].map(n=>`<article class="card"><span class="tag">PHẦN ${n===1?'1 · Câu 1–40':'2 · Câu 41–80'} · 40 CÂU</span><h3>Phần ${n===1?'1 · Câu 1–40':'2 · Câu 41–80'}</h3><button data-topic="${n}">Luyện từng câu →</button><button class="primary" data-exam="${n}">Thi thử phần ${n===1?'1 · Câu 1–40':'2 · Câu 41–80'} →</button></article>`).join('')}<article class="card"><h3>Củng cố kiến thức</h3><button data-start="wrong">Ôn câu sai (${db.wrong.length})</button><button data-start="bookmarks">Câu đánh dấu (${db.bookmarks.length})</button></article></section><h2 style="margin-top:30px">Tra cứu câu hỏi</h2><div class="tools"><input id="search" placeholder="Tìm nội dung câu hỏi…" aria-label="Tìm câu hỏi"><select id="level" aria-label="Mức độ"><option value="">Tất cả mức độ</option>${[...new Set(bank.map(q=>q.level))].map(l=>`<option>${esc(l)}</option>`).join('')}</select><button id="browse">Tra cứu</button></div><div id="searchResults"></div><h2 style="margin-top:30px">Lịch sử luyện tập</h2>${db.history.slice(0,10).map(h=>`<div class="history row"><span>${esc(h.mode)} · ${esc(h.date)}</span><b>${h.correct}/${h.total} câu đúng · ${h.score}/10</b></div>`).join('')||'<p class="muted">Chưa có lượt hoàn thành.</p>'}<p class="muted">Tiến độ được lưu trên trình duyệt và thiết bị đang sử dụng.</p>`;document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start));document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>start('practice',+b.dataset.topic));document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>start('exam',+b.dataset.exam));$('#browse').onclick=browse;$('#search').oninput=browse;$('#level').onchange=browse}
function browse(){let s=$('#search').value.toLocaleLowerCase('vi'),l=$('#level').value;let list=bank.filter(q=>(!l||q.level===l)&&(q.text+' '+q.options.join(' ')).toLocaleLowerCase('vi').includes(s));$('#searchResults').innerHTML=`<p class="muted">${list.length} câu phù hợp</p>`+list.map(q=>`<div class="review-item"><span class="tag">Đề ${q.set} · Câu ${q.number} · ${esc(q.level)}</span><p>${esc(q.text)}</p><details><summary>Xem phương án và đáp án từ tài liệu</summary>${q.options.map((o,i)=>`<p>${'ABCD'[i]}. ${esc(o)} ${i===q.answer?'✓':''}</p>`).join('')}</details></div>`).join('')}
function start(mode,topic){let minutes=Number($('#duration')?.value||50);let qs=mode==='wrong'?bank.filter(q=>db.wrong.includes(q.id)):mode==='bookmarks'?bank.filter(q=>db.bookmarks.includes(q.id)):bank.slice();if(topic)qs=qs.filter(q=>q.set===topic);qs=qs.map(q=>{let opts=shuffle(q.options.map((text,index)=>({text,index})));return {...q,options:opts.map(o=>o.text),answer:opts.findIndex(o=>o.index===q.answer)}});if(!qs.length){alert('Chưa có câu trong danh sách này. Anh hãy luyện hoặc đánh dấu câu trước nhé.');return}if(mode!=='exam')qs=shuffle(qs);active={mode,qs,answers:{},revealed:{},i:0,end:Date.now()+minutes*60000};renderQuiz();if(mode==='exam')timer=setInterval(()=>{if(!active)return;let remain=Math.max(0,Math.ceil((active.end-Date.now())/1000));let el=$('#clock');if(el)el.textContent=fmt(remain);if(!remain)finish(false)},1000)}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function renderQuiz(){let a=active,q=a.qs[a.i],ans=a.answers[q.id],show=a.revealed[q.id],done=Object.keys(a.answers).length;$('#app').innerHTML=`<div class="row"><div><div class="eyebrow" style="color:#627d50">${a.mode==='exam'?`THI THỬ · PHẦN ${a.qs[0].set}`:'LUYỆN TẬP · PHẢN HỒI TỪNG CÂU'}</div><h2>Vững kiến thức, tự tin hơn</h2></div><button id="exit">Thoát</button></div><div class="quiz"><section class="panel"><div class="row"><span class="tag">Câu ${a.i+1}/${a.qs.length} · ${esc(q.level)}</span><button id="bookmark" aria-label="Đánh dấu câu">${db.bookmarks.includes(q.id)?'★ Đã đánh dấu':'☆ Đánh dấu'}</button></div><div class="question">${esc(q.text)}</div>${q.options.map((o,i)=>`<button class="option ${ans===i?'selected':''} ${show&&i===q.answer?'correct':''} ${show&&ans===i&&i!==q.answer?'wrong':''}" data-option="${i}" ${show?'disabled':''}><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}${show?`<div class="answer-note">${q.explanation?`<p>${esc(q.explanation)}</p>`:''}<b>${ans===q.answer?'✓ Trùng đáp án tài liệu':'Đáp án tài liệu: '+ 'ABCD'[q.answer]}</b><div class="muted">Nguồn dẫn trong file: ${esc(q.source)} · Câu gốc ${q.number}. Chưa thẩm định nguồn.</div></div>`:''}<div class="row" style="margin-top:22px"><button id="prev" ${a.i===0?'disabled':''}>← Trước</button>${a.mode!=='exam'&&!show?`<button class="primary" id="check" ${ans===undefined?'disabled':''}>Kiểm tra đáp án</button>`:''}<button id="next" ${a.i===a.qs.length-1?'disabled':''}>Tiếp →</button></div></section><aside class="panel">${a.mode==='exam'?`<div class="muted">Thời gian còn lại</div><div class="timer" id="clock">${fmt(Math.max(0,Math.ceil((a.end-Date.now())/1000)))}</div>`:'<h3>Tiến độ luyện tập</h3>'}<div class="muted">Đã chọn ${done}/${a.qs.length} câu</div><div class="progress"><i style="width:${done/a.qs.length*100}%"></i></div><div class="numbers">${a.qs.map((v,i)=>`<button data-jump="${i}" class="${a.answers[v.id]!==undefined?'selected':''} ${i===a.i?'current':''}">${i+1}${db.bookmarks.includes(v.id)?'★':''}</button>`).join('')}</div><button class="primary" style="width:100%" id="finish">${a.mode==='exam'?'Nộp bài':'Kết thúc & xem kết quả'}</button><p class="muted">${a.mode==='exam'?'Đáp án hiển thị sau khi nộp bài.':'Chọn phương án rồi nhấn Kiểm tra đáp án.'}</p></aside></div>`;document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{a.answers[q.id]=+b.dataset.option;renderQuiz()});document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{a.i=+b.dataset.jump;renderQuiz()});$('#prev').onclick=()=>{a.i--;renderQuiz()};$('#next').onclick=()=>{a.i++;renderQuiz()};if($('#check'))$('#check').onclick=()=>{a.revealed[q.id]=true;renderQuiz()};$('#bookmark').onclick=()=>{db.bookmarks=db.bookmarks.includes(q.id)?db.bookmarks.filter(id=>id!==q.id):[...db.bookmarks,q.id];save();renderQuiz()};$('#exit').onclick=()=>{if(confirm('Thoát lượt đang làm? Kết quả lượt này chưa được lưu.'))dashboard()};$('#finish').onclick=()=>finish(true)}
function finish(ask){if(!active)return;let a=active,missing=a.qs.length-Object.keys(a.answers).length;if(ask&&!confirm(missing?`Còn ${missing} câu chưa chọn. Anh muốn kết thúc và chấm bài?`:'Kết thúc và chấm bài?'))return;clearInterval(timer);let correct=a.qs.filter(q=>a.answers[q.id]===q.answer).length;for(let q of a.qs){if(a.answers[q.id]===q.answer)db.wrong=db.wrong.filter(id=>id!==q.id);else if(!db.wrong.includes(q.id))db.wrong.push(q.id)}let score=(correct/a.qs.length*10).toFixed(2);db.history.unshift({mode:(a.mode==='exam'?'Thi thử':'Luyện tập')+(a.qs.every(q=>q.set===a.qs[0].set)?' đề '+(a.qs[0].set):' tổng hợp'),date:new Date().toLocaleString('vi-VN'),correct,total:a.qs.length,score});db.history=db.history.slice(0,50);save();$('#app').innerHTML=`<section class="panel score"><span class="tag">ĐÃ HOÀN THÀNH</span><h1>Kết quả của anh</h1><strong>${score}<small style="font-size:20px">/10</small></strong><p>${correct}/${a.qs.length} câu trùng đáp án tài liệu · ${missing} câu chưa trả lời</p><div class="tools" style="justify-content:center"><button class="primary" id="again">Ôn câu sai</button><button id="back">Về tổng quan</button></div><p class="muted">Điểm luyện tập được quy đổi tuyến tính theo số câu đúng, không thay thế thang điểm hội thi.</p></section><h2 style="margin-top:28px">Xem lại bài làm</h2><section class="panel">${a.qs.map(q=>`<div class="review-item"><span class="tag">Đề ${q.set} · Câu ${q.number} · ${a.answers[q.id]===q.answer?'Đúng theo tài liệu':'Cần ôn lại'}</span><p><b>${esc(q.text)}</b></p><p class="muted">Nguồn dẫn trong file: ${esc(q.source)}</p>${q.options.map((o,i)=>`<p style="color:${i===q.answer?'#26763d':a.answers[q.id]===i?'#b35543':'inherit'}">${'ABCD'[i]}. ${esc(o)} ${i===q.answer?'✓ Đáp án tài liệu':''}${a.answers[q.id]===i?' · Anh chọn':''}</p>`).join('')}</div>`).join('')}</section>`;active=null;$('#again').onclick=()=>start('wrong');$('#back').onclick=dashboard;window.scrollTo(0,0)}
$('#home').onclick=$('#logo').onclick=e=>{e.preventDefault();if(!active||confirm('Thoát lượt đang làm? Kết quả lượt này chưa được lưu.'))dashboard()};dashboard();
</script></body></html>
